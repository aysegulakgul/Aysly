# Yerel geliştirme altyapısı (D-045, D-056). Yalnızca yerel bilgisayarda çalışır.
# Portlar yalnızca 127.0.0.1'e açılır; ağdaki başka cihazlar erişemez.
# PostgreSQL 5433 portunda: bu bilgisayarda 5432 başka bir yerel PostgreSQL kurulumunca kullanılıyor.
name: aysly

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aysly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aysly_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aysly}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aysly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mail:
    # Yerel e-posta yakalayıcı: e-postalar dışarı gönderilmez, http://localhost:8025 adresinde görüntülenir (D-055).
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  aysly_pgdata:
